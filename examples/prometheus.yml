# Prometheus configuration for the docker-compose demo stack.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: inference-demo

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: inference-service
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: inference-service
    metrics_path: /metrics
    # The endpoint renders from an in-memory registry in microseconds; a short
    # timeout surfaces a genuinely wedged process rather than masking it.
    scrape_timeout: 3s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# In production replace the static config with service discovery, e.g.:
