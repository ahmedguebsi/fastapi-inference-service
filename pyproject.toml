[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[project]
name = "inference-service"
version = "1.0.0"
description = "Production-grade FastAPI text classification inference service with dynamic batching"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "Ahmed Guebsi", email = "ahmed.guebsi@enis.tn" }]
keywords = ["fastapi", "inference", "ml-serving", "batching", "prometheus", "mlops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Deliberately minimal. Every dependency lands in the runtime image and counts
# against the 200 MB budget, so each one is justified:
#   fastapi            - the framework; brings starlette + pydantic
#   uvicorn[standard]  - ASGI server; 'standard' adds uvloop/httptools, which
#                        are a material throughput win for an inference gateway
#   prometheus-client  - correct exposition, multiprocess mode, exemplars
# Notably ABSENT: numpy, torch, onnxruntime. See docs/architecture.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
inference-service = "inference_service.__main__:main"

[project.urls]
Homepage = "https://github.com/example/fastapi-inference-service"
Documentation = "https://github.com/example/fastapi-inference-service/tree/main/docs"
Issues = "https://github.com/example/fastapi-inference-service/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_service"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/config", "/models", "/scripts", "/README.md"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetime
    "T20",      # print
    "SIM",      # simplify
    "PTH",      # pathlib
    "RET",      # returns
    "ARG",      # unused arguments
    "ASYNC",    # async antipatterns
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "S",        # bandit
]
ignore = [
    "PLR0913",  # many arguments: DI-heavy handlers legitimately take several
    "PLR2004",  # magic values: HTTP status codes read better inline
    "RET504",   # named returns aid readability in response builders
    "B008",     # function call in default: this IS the FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
# Entry points are the one place print() to stderr is the right interface.
"src/inference_service/__main__.py" = ["T201"]
# A flat sequence of independent `if override is not None` branches. Splitting
# it to satisfy a branch count would make it harder to read, not easier.
"src/inference_service/config.py" = ["PLR0912", "PLR0915"]
# Artifact validation: a linear run of explicit field checks. Each one exists so
# a malformed artifact fails loudly at startup instead of producing silently
# wrong predictions, and collapsing them would obscure exactly that.
"src/inference_service/model/linear.py" = ["PLR0912", "PLR0915"]
# Tests may assert, touch private members, hardcode credentials and bind ports.
"tests/**/*.py" = [
    "S101", "S105", "S106", "S104", "SLF001", "ARG001", "ARG002",
    "PLR2004", "T201", "PLC0415", "ASYNC",
]
# Developer tooling: printing is the interface; the sys.path shim must precede
# the package imports by construction.
"scripts/*.py" = ["T201", "E402", "PLR0915", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["inference_service", "tests"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real server process or socket",
    "slow: takes more than a second",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/inference_service"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "\\.\\.\\.",
]
fail_under = 80
